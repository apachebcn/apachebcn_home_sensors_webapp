<input type="hidden" name="{{ name }}" id="id_{{ name }}" value="{{ value }}">
<td class='switch-centered'>
    <label class="switch">
        <input id="{{ name }}_ON" value="1" type="checkbox" onchange="toggleCheckbox('{{ name }}', '{{ name }}_ON')" {% if value == "1" or value == 1 %}CHECKED{% endif %}>
        <span class="slider slider-green"></span>
    </label>
</td>
<td class='switch-centered'>
    <label class="switch">
        <input id="{{ name }}_OFF" value="2" type="checkbox" onchange="toggleCheckbox('{{ name }}', '{{ name }}_OFF')" {% if value == "2" or value == 2 %}CHECKED{% endif %}>
        <span class="slider slider-red"></span>
    </label>
</td>
